input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  mutate {
    remove_field => ["host", "port"]
  }
  mutate {
      gsub => [
        "requestBody",  '("tckn"\s*:\s*"?)(\d{3})\d{6}(\d{2})', '\1\2******\3',
        "responseBody", '("tckn"\s*:\s*"?)(\d{3})\d{6}(\d{2})', '\1\2******\3'
      ]
    }
}

output {
  elasticsearch {
    hosts => ["http://es01:9200", "http://es02:9200", "http://es03:9200"]
    index => "api-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}